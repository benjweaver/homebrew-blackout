name: Update cask

# Points the cask at the latest Blackout release, then tests it.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # GitHub turns off scheduled workflows after 60 days without repository
      # activity, and this tap only changes when Blackout has a release.
      # Re-enabling the workflow through the API keeps the schedule running.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
      - uses: actions/checkout@v4
      - name: Regenerate the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-cask.sh
      - name: Commit and test if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The cask already points at the latest release."
            exit 0
          fi
          tag=$(gh release view --repo benjweaver/blackout --json tagName -q .tagName)
          version=${tag#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "blackout $version"
          git push
          # Pushes made with this token don't trigger workflows, so start the tests explicitly.
          gh workflow run test.yml --ref "$GITHUB_REF_NAME"
